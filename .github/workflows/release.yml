name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: src
        run: dotnet restore

      - name: Build
        working-directory: src
        run: dotnet build -c Release --no-restore

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ./src/bin/Release/net10.0-windows/* `
            -DestinationPath ./TouhouBGMPlayers-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./TouhouBGMPlayers-${{ github.ref_name }}.zip
          generate_release_notes: true