name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        rid:
          - win-x64
          - win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: src
        run: dotnet restore

      - name: Publish
        working-directory: src
        run: >
          dotnet publish ThbgmPlayer.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained false
          -o ../publish/${{ matrix.rid }}

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ./publish/${{ matrix.rid }}/* `
            -DestinationPath ./TouhouBGMPlayers-${{ github.ref_name }}-${{ matrix.rid }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouhouBGMPlayers-${{ matrix.rid }}
          path: ./TouhouBGMPlayers-${{ github.ref_name }}-${{ matrix.rid }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: TouhouBGMPlayers-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true